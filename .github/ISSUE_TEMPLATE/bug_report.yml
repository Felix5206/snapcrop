name: 缺陷报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量填写完整，这会显著加快定位速度。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 简洁说明出现了什么问题
      placeholder: 导入 10 张照片后点击「应用到全部」，第 3 张位置没有同步
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出操作
      placeholder: |
        1. 导入 10 张横版照片
        2. 选择「一寸」模板
        3. 拖动第 1 张照片
        4. 点击「应用到全部」
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可粘贴控制台报错（F12 → Console）或上传截图
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: Chrome 131.0.6778.86
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SnapCrop 版本
      placeholder: v1.0.0
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认项
      options:
        - label: 我已搜索过现有 Issue，确认不是重复问题
          required: true
        - label: 我使用的是最新版本的 SnapCrop
          required: false
