<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SnapCrop 简裁">
  <title>简裁 SnapCrop</title>
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4bff"/>
      <stop offset="1" stop-color="#4a86ff"/>
    </linearGradient>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e8ff"/>
      <stop offset="1" stop-color="#93bcff"/>
    </linearGradient>
    <linearGradient id="sc-mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa5ff"/>
      <stop offset="1" stop-color="#2b55ff"/>
    </linearGradient>
    <clipPath id="sc-photo">
      <rect x="18" y="14" width="28" height="30" rx="2"/>
    </clipPath>
    <clipPath id="sc-squircle">
      <rect x="2" y="2" width="60" height="60" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sc-squircle)">
    <rect x="2" y="2" width="60" height="60" fill="url(#sc-bg)"/>
    <!-- 斜向高光，玻璃质感 -->
    <path d="M2 34C2 19 13 8 28 6c-15 9-19 24-19 28z" fill="#ffffff" opacity=".14"/>

    <!-- 照片内容：浅蓝天空 + 白色太阳 + 两座蓝山 -->
    <g clip-path="url(#sc-photo)">
      <rect x="18" y="14" width="28" height="30" fill="url(#sc-sky)"/>
      <circle cx="27" cy="24" r="4" fill="#ffffff"/>
      <path d="M15 45c4-9 9-13 13-13s10 4 14 13z" fill="url(#sc-mt)"/>
    </g>

    <!-- 取景框 -->
    <rect x="17.5" y="13.5" width="29" height="31" rx="2.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- 裁剪角标（左上 / 右下） -->
  <path d="M13 21v-9h9M51 37v9h-9" fill="none" stroke="#ffffff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
