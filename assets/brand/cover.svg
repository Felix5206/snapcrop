<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="SnapCrop 封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a86ff"/>
      <stop offset="1" stop-color="#2f4bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1b2a5a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1160" cy="90" r="240" fill="#ffffff" opacity=".5"/>
  <circle cx="120" cy="580" r="200" fill="#dfe7ff" opacity=".55"/>

  <!-- 左侧文字 -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="96" y="150" width="64" height="64" rx="16" fill="url(#brand)"/>
    <rect x="112" y="166" width="32" height="32" rx="3" fill="none" stroke="#fff" stroke-width="3.4"/>
    <circle cx="128" cy="176" r="4.5" fill="#fff"/>
    <path d="M114 192c1.6-3.2 4.2-4.8 6.6-4.8s5 1.6 6.6 4.8z" fill="#fff"/>

    <text x="180" y="204" font-size="54" font-weight="700" fill="#121a2c">简裁 SnapCrop</text>
    <text x="96" y="272" font-size="30" font-weight="600" fill="#2f4bff">纯本地照片裁切 · 原像素无损</text>
    <text x="96" y="330" font-size="21" fill="#4a5568">证件照批量裁切 + 精准裁剪定位 · 不上传、不压缩</text>

    <g font-size="19" fill="#3c4a63">
      <text x="96" y="392">• 100% 浏览器本地处理，照片不上传</text>
      <text x="96" y="428">• 模板可配置、可扩展，支持自定义尺寸与 DPI</text>
      <text x="96" y="464">• 零依赖单页应用，双击 index.html 即用</text>
    </g>

    <rect x="96" y="508" width="230" height="54" rx="27" fill="url(#brand)"/>
    <text x="211" y="543" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">开源 · MIT License</text>
  </g>

  <!-- 右侧示意：三张不同比例的卡片 -->
  <g filter="url(#sh)">
    <rect x="700" y="120" width="230" height="322" rx="14" fill="#ffffff"/>
    <rect x="722" y="142" width="186" height="248" rx="6" fill="#dbe4f7"/>
    <circle cx="815" cy="220" r="34" fill="#9fb6ea"/>
    <path d="M755 330c12-26 32-38 60-38s48 12 60 38z" fill="#9fb6ea"/>
    <text x="815" y="408" font-size="16" fill="#5a6780" text-anchor="middle" font-family="system-ui, sans-serif">一寸 295 × 413</text>

    <rect x="962" y="150" width="180" height="200" rx="12" fill="#ffffff"/>
    <rect x="980" y="168" width="144" height="152" rx="5" fill="#c9d6f5"/>
    <text x="1052" y="336" font-size="15" fill="#5a6780" text-anchor="middle" font-family="system-ui, sans-serif">二寸 413 × 579</text>

    <rect x="962" y="376" width="180" height="132" rx="12" fill="#ffffff"/>
    <rect x="980" y="392" width="144" height="96" rx="5" fill="#b9cbfa"/>
    <text x="1052" y="502" font-size="15" fill="#5a6780" text-anchor="middle" font-family="system-ui, sans-serif">六寸 1200 × 1800</text>
  </g>
</svg>
